name: Deploy Simulation

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cek Tipe Tag & Jalankan Simulasi Deploy
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Mendeteksi push tag: $TAG_NAME"
          
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "==========================================="
            echo "🚀 SEDANG DEPLOY KE SERVER STAGING..."
            echo "Versi uji coba $TAG_NAME siap di-test QA!"
            echo "==========================================="
          else
            echo "==========================================="
            echo "🎉 SEDANG DEPLOY KE SERVER PRODUCTION (LIVE)..."
            echo "Versi stabil $TAG_NAME berhasil rilis!"
            echo "==========================================="
          fi
